# Bumping QT_REPO_MODULE_VERSION for a new Qt release requires a row for
# the new release in src/qdoc/qdoc/doc/qdoc-guide/qdoc-clang-versions.qdocinc,
# without it, the configuration emits a warning. Add the row with
#   cmake -P src/qdoc/cmake/GenerateQdocClangVersions.cmake
# and include the updated file in the bump commit.
set(QT_REPO_MODULE_VERSION "6.13.0")
set(QT_REPO_MODULE_PRERELEASE_VERSION_SEGMENT "alpha1")
set(QT_EXTRA_INTERNAL_TARGET_DEFINES
    "QT_NO_QASCONST=1"
    "QT_NO_CONTEXTLESS_CONNECT=1"
    "QT_NO_SINGLE_ARGUMENT_QHASH_OVERLOAD=1"
    "QT_NO_FOREACH=1"
    "QT_LEAN_HEADERS=1"
    "QT_ENABLE_STRICT_MODE_UP_TO=QT_VERSION_CHECK(6,11,0)"
)
